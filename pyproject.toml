[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quant-research-terminal"
version = "0.1.0"
description = "Local desktop foundation for reproducible quantitative research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7,<7",
    "pydantic>=2.7,<3",
    "polars>=1.14,<2",
    "pyarrow>=16,<18",
    # Runtime, not dev: the storage schema declares timestamp[us, tz=UTC], and
    # resolving that zone name through zoneinfo requires an IANA database. A
    # stock Windows install has none, so without this package ZoneInfo("UTC")
    # raises, PyArrow as_py() fails, and Polars panics at the Rust level while
    # materializing timestamps. Declared unconditionally on every platform —
    # zoneinfo prefers the system database where one exists, so this is a
    # deterministic fallback, never a platform-specific special case.
    # Calendar-versioned data with no API surface; no upper bound is meaningful.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
quant-research-terminal = "quant_research_terminal.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research_terminal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: fast unit tests for domain and storage contracts",
    "integration: higher-level UI or application integration tests",
]

[tool.ruff]
line-length = 100
# Must agree with requires-python: linting for an older Python hides 3.12-only
# idioms from upgrade rules and emits compatibility noise the project forbids.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["quant_research_terminal"]

