# CME_EQUITY_INDEX calendar definition, version 1.
#
# Declarative schedule facts for the CME Globex EQUITIES product group (the
# schedule class that includes E-mini S&P 500 (ES) and E-mini Nasdaq-100 (NQ)
# futures). Every rule and dated exception cites evidence records defined at
# the bottom of this file; the durable narrative register with retrieval
# details is docs/calendar-evidence.md. No fact in this file was authored from
# memory: unknown schedule semantics are expressed by the supported range
# ending, never by an invented "normal day".
#
# All wall times are exchange-local America/Chicago ("U.S. Central Time" in
# CME's own documents; America/Chicago is the canonical IANA zone for U.S.
# Central Time). Released versions of this file are immutable: corrections
# happen in a new version with a new materialized content hash.

schema = "qrt-calendar-definition/1"

[calendar]
id = "CME_EQUITY_INDEX"
version = 1
timezone = "America/Chicago"
first_trading_date = 2023-05-22
last_trading_date = 2023-12-29

# ---------------------------------------------------------------------------
# Declarative tzdb probes: what the effective timezone database must say for
# America/Chicago around the supported range. These are tzdb facts, not CME
# facts; they make a divergent or stale zoneinfo source fail materialization
# loudly instead of silently shifting every window.
# ---------------------------------------------------------------------------

[[timezone_probe]]  # standard time (CST, UTC-6) in winter 2023
utc_instant = 2023-01-15T12:00:00Z
expected_utc_offset_minutes = -360

[[timezone_probe]]  # daylight time (CDT, UTC-5) in summer 2023
utc_instant = 2023-06-15T12:00:00Z
expected_utc_offset_minutes = -300

[[timezone_probe]]  # instant before the 2023 spring-forward (2023-03-12 02:00 CST)
utc_instant = 2023-03-12T07:59:59Z
expected_utc_offset_minutes = -360

[[timezone_probe]]  # instant at/after the 2023 spring-forward transition
utc_instant = 2023-03-12T08:00:00Z
expected_utc_offset_minutes = -300

[[timezone_probe]]  # instant before the 2023 fall-back (2023-11-05 02:00 CDT)
utc_instant = 2023-11-05T06:59:59Z
expected_utc_offset_minutes = -300

[[timezone_probe]]  # instant at/after the 2023 fall-back transition
utc_instant = 2023-11-05T07:00:00Z
expected_utc_offset_minutes = -360

# ---------------------------------------------------------------------------
# Recurring weekly session, keyed by the weekday of the TRADING DATE.
# Day offsets are civil-day offsets from the trading date: -1 is the calendar
# day before it. A trading date's session opens at 17:00 the previous day,
# halts 15:15-15:30 on the trading date, and finally closes at 16:00
# (Sunday-Friday 6:00 p.m. - 5:00 p.m. ET with a trading halt 4:15-4:30 p.m.
# ET, per CME's FAQ). Saturday and Sunday are never trading dates.
# ---------------------------------------------------------------------------

[[weekly.monday]]  # Sunday pre-open (order entry, no matching)
state = "halt"
start_day_offset = -1
start_time = 16:00:00
end_day_offset = -1
end_time = 17:00:00
verification = "corroborated"
evidence = ["cme-memorial-day-2023-schedule", "cme-labor-day-2023-schedule", "cme-christmas-2023-schedule"]

[[weekly.monday]]
state = "trading"
start_day_offset = -1
start_time = 17:00:00
end_day_offset = 0
end_time = 15:15:00
verification = "verified-primary"
evidence = ["cme-micro-emini-faq-2023-12", "cme-micro-emini-faq-2021-01"]

[[weekly.monday]]  # daily trading halt, 4:15-4:30 p.m. ET
