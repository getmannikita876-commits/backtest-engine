start_day_offset = 0
start_time = 15:15:00
end_day_offset = 0
end_time = 15:30:00
verification = "verified-primary"
evidence = ["cme-micro-emini-faq-2023-12", "cme-micro-emini-faq-2021-01"]

[[weekly.monday]]
state = "trading"
start_day_offset = 0
start_time = 15:30:00
end_day_offset = 0
end_time = 16:00:00
verification = "verified-primary"
