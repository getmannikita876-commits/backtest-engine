[[weekly.tuesday]]  # weekday pre-open (order entry, no matching)
state = "halt"
start_day_offset = -1
start_time = 16:45:00
end_day_offset = -1
end_time = 17:00:00
# Corroborated, not verified-primary: the 16:45 pre-open is stated by the
# holiday PDFs for specific transition days; its application to every
# ordinary weekday is inferred from the instances' consistency — the same
